<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7490" />
    <script>
      // Terapkan tema tersimpan sebelum render pertama agar tidak berkedip.
      (function () {
        try {
          var t = localStorage.getItem("siap-guru-theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Siap Guru — sistem perangkat ajar digital Kurikulum Merdeka: CP, TP, ATP, KKTP, PPM, nilai, dan cetak dokumen administrasi."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Siap Guru — Sistem Perangkat Ajar Kurikulum Merdeka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
